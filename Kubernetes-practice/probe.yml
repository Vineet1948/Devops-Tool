apiVersion: apps/v1
kind: Deployment
metadata: 
  name: deployment
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: test
  template:
    metadata:
      labels: 
        app: test
    spec:
      containers: 
        - name: probcont
          image: nginx:latest
          livenessProbe:
            httpGet: 
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3